name: EV AI/ML CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  setup-and-test:
    name: Setup, Lint, Test & Run ML Workflow
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run code linting with flake8
      - name: Lint code
        run: |
          pip install flake8
          flake8 src

      # 5. Run tests
      - name: Run unit tests
        run: |
          pip install pytest
          pytest --maxfail=1 --disable-warnings -v

      # 6. Run ML pipeline (optional)
      - name: Run ML pipeline for training
        run: |
          python src/pipelines/train_all.py

      # 7. Run inference test (optional)
      - name: Test AI inference
        run: |
          python -c "from infer.manager import ModelManager; mgr = ModelManager(); print(mgr.predict_consumption({'distance':120,'speed':90,'temp':30,'ac':1,'heater':0,'payload':150,'battery_kwh':60,'eff':0.17}))"

      # 8. Upload test logs/artifacts (optional)
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: test-logs
          path: pytest.log
